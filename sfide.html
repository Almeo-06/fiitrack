<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FitTrack · Sfide</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#020810">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FitTrack">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#020810; --bg2:#060d1a; --bg3:#0a1428;
  --a1:#0088ff; --a2:#00ccff;
  --text:#e0f4ff; --textm:#304870; --border:#0d1e38;
  --green:#00e676; --red:#ff4455; --warn:#ffaa00;
  --font:'DM Sans',sans-serif; --mono:'DM Mono',monospace;
}
*{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html,body{ height:100%; overflow:hidden; }
html{ height:-webkit-fill-available; }
body{
  background:var(--bg); color:var(--text); font-family:var(--font);
  max-width:480px; margin:0 auto;
  height:100vh; height:100dvh; min-height:-webkit-fill-available;
  position:relative; overflow:hidden;
  display:flex; flex-direction:column;
}

/* ── EFFETTI BACKGROUND ── */
body::before{
  content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
  background:
    radial-gradient(ellipse 90% 40% at 50% -5%, rgba(0,136,255,.09), transparent),
    radial-gradient(ellipse 50% 30% at 90% 95%, rgba(0,60,180,.06), transparent);
}

/* ── HEADER ── */
.page-header{
  flex-shrink:0; display:flex; align-items:center; justify-content:space-between;
  padding:calc(14px + env(safe-area-inset-top,0px)) 16px 12px; border-bottom:1px solid var(--border);
  background:rgba(6,13,26,.97); position:relative; z-index:2;
}
.header-left{ display:flex; align-items:center; gap:10px; }
.back-btn{
  width:32px; height:32px; border-radius:50%; background:var(--bg3);
  border:1px solid var(--border); color:var(--textm); font-size:17px;
  cursor:pointer; display:flex; align-items:center; justify-content:center;
  flex-shrink:0; transition:border-color .2s;
}
.back-btn:active{ border-color:var(--a1); }
.page-title{ font-size:17px; font-weight:600; color:var(--text); }
.add-btn{
  width:32px; height:32px; border-radius:50%;
  background:linear-gradient(135deg,var(--a1),var(--a2));
  border:none; color:#fff; font-size:19px;
  cursor:pointer; display:flex; align-items:center; justify-content:center;
  box-shadow:0 2px 12px rgba(0,136,255,.3); transition:transform .15s;
}
.add-btn:active{ transform:scale(.92); }

/* ── SCROLL AREA ── */
.scroll-area{
  flex:1; overflow-y:auto; padding:16px 16px 90px;
  -webkit-overflow-scrolling:touch; position:relative; z-index:1;
}
.scroll-area::-webkit-scrollbar{ width:0; }

/* ── SECTION TITLE ── */
.section-title{
  font-size:10px; font-weight:500; color:var(--textm);
  letter-spacing:2px; text-transform:uppercase;
  margin-bottom:10px; display:flex; align-items:center; gap:7px;
}
.section-dot{ width:5px; height:5px; border-radius:50%; flex-shrink:0; }

/* ── EMPTY STATE ── */
.empty-state{
  text-align:center; padding:40px 20px;
  background:var(--bg2); border:1px solid var(--border);
  border-radius:16px; margin-bottom:14px;
}
.empty-icon{ font-size:36px; margin-bottom:10px; }
.empty-title{ font-size:15px; font-weight:500; color:var(--text); margin-bottom:6px; }
.empty-sub{ font-size:12px; color:var(--textm); line-height:1.5; }

/* ── CHALLENGE CARD ── */
.challenge-card{
  background:var(--bg2); border:1px solid var(--border);
  border-radius:14px; padding:14px; margin-bottom:10px;
  transition:border-color .2s;
}
.challenge-card.completed-card{
  background:rgba(0,230,118,.03); border-color:rgba(0,230,118,.15);
  opacity:.75;
}
.challenge-card:active{ border-color:var(--a1); }
.ch-top{ display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:8px; }
.ch-left{ display:flex; align-items:flex-start; gap:9px; flex:1; min-width:0; }
.ch-icon{
  width:34px; height:34px; border-radius:10px; flex-shrink:0;
  background:rgba(0,136,255,.1); border:1px solid rgba(0,136,255,.2);
  display:flex; align-items:center; justify-content:center; font-size:17px;
}
.ch-info{ flex:1; min-width:0; }
.ch-name{ font-size:13px; font-weight:500; color:var(--text); margin-bottom:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.ch-deadline{ font-size:10px; color:var(--textm); }
.ch-deadline.urgent{ color:var(--warn); }
.ch-deadline.expired{ color:var(--red); }
.ch-right{ display:flex; align-items:center; gap:8px; flex-shrink:0; }
.ch-pct{ font-family:var(--mono); font-size:12px; font-weight:500; color:var(--a2); }
.ch-delete{
  width:22px; height:22px; border-radius:50%; background:transparent;
  border:1px solid var(--border); color:var(--textm); font-size:10px;
  cursor:pointer; display:flex; align-items:center; justify-content:center;
  transition:border-color .2s, color .2s;
}
.ch-delete:active{ border-color:var(--red); color:var(--red); }
.ch-progress-row{ display:flex; align-items:center; justify-content:space-between; margin-bottom:5px; }
.ch-prog-label{ font-size:10px; color:var(--textm); }
.ch-prog-val{ font-family:var(--mono); font-size:10px; color:var(--a2); }
.ch-prog-bg{ height:5px; background:var(--bg3); border-radius:99px; overflow:hidden; }
.ch-prog-fill{
  height:100%; border-radius:99px;
  background:linear-gradient(90deg,var(--a1),var(--a2));
  transition:width .4s cubic-bezier(.25,1,.3,1);
}
.ch-prog-fill.done-fill{ background:linear-gradient(90deg,#00aa44,var(--green)); }
.ch-manual-row{ display:flex; align-items:center; gap:8px; margin-top:8px; }
.ch-manual-label{ font-size:10px; color:var(--textm); flex:1; }
.ch-manual-input{
  width:70px; background:var(--bg3); border:1px solid var(--border);
  border-radius:8px; color:var(--text); font-family:var(--mono); font-size:12px;
  padding:5px 8px; text-align:center;
}
.ch-manual-input:focus{ outline:none; border-color:var(--a1); }
.ch-done-badge{
  display:inline-flex; align-items:center; gap:4px;
  font-size:9px; color:var(--green); background:rgba(0,230,118,.1);
  border:1px solid rgba(0,230,118,.25); border-radius:5px; padding:2px 6px;
  margin-top:8px; letter-spacing:.5px;
}

/* ── COLLAPSIBLE COMPLETATE ── */
.collapse-btn{
  width:100%; background:var(--bg2); border:1px solid var(--border);
  border-radius:12px; color:var(--textm); font-size:11px; font-family:var(--font);
  padding:10px 14px; cursor:pointer; display:flex; align-items:center;
  justify-content:space-between; margin-bottom:10px; transition:border-color .2s;
}
.collapse-btn:active{ border-color:var(--a1); }
.collapse-arrow{ transition:transform .3s; font-size:12px; }
.collapse-arrow.open{ transform:rotate(180deg); }
#completedList{ display:none; }

/* ── TAB BAR ── */
.tab-bar{
  position:absolute; bottom:0; left:0; right:0;
  background:rgba(6,13,26,.97); border-top:1px solid var(--border);
  display:flex; padding:8px 0 12px; z-index:5;
}
.tab-item{
  flex:1; display:flex; flex-direction:column; align-items:center;
  gap:3px; font-size:9px; color:var(--textm); cursor:pointer;
  position:relative;
}
.tab-item.on{ color:var(--a2); }
.tab-item.on::after{
  content:''; position:absolute; top:0; left:50%; transform:translateX(-50%);
  width:18px; height:2px; border-radius:0 0 3px 3px;
  background:var(--a2); box-shadow:0 0 8px var(--a2);
}
.tab-icon{ font-size:18px; }

/* ── MODAL SHEET ── */
.sheet-overlay{
  position:fixed; inset:0; z-index:20;
  background:rgba(0,0,0,0); pointer-events:none;
  transition:background .3s;
}
.sheet-overlay.visible{ background:rgba(0,0,0,.6); pointer-events:all; }
.sheet{
  position:fixed; bottom:0; left:50%; transform:translateX(-50%) translateY(100%);
  width:100%; max-width:480px; z-index:21;
  background:var(--bg2); border-radius:20px 20px 0 0;
  border-top:1px solid var(--border);
  padding:0 0 env(safe-area-inset-bottom,0);
  transition:transform .35s cubic-bezier(.25,1,.3,1);
  will-change:transform;
}
.sheet.open{ transform:translateX(-50%) translateY(0); }
.sheet-handle{
  width:36px; height:4px; border-radius:2px; background:var(--border);
  margin:12px auto 16px;
}
.sheet-inner{ padding:0 16px 24px; max-height:80vh; overflow-y:auto; }
.sheet-inner::-webkit-scrollbar{ width:0; }
.sheet-title{ font-size:16px; font-weight:600; color:var(--text); margin-bottom:16px; }

/* ── FORM ELEMENTS ── */
.form-label{ font-size:10px; color:var(--textm); letter-spacing:.8px; text-transform:uppercase; margin-bottom:6px; display:block; }
.form-input{
  width:100%; background:var(--bg3); border:1px solid var(--border);
  border-radius:10px; color:var(--text); font-family:var(--font); font-size:13px;
  padding:10px 13px; margin-bottom:14px;
}
.form-input:focus{ outline:none; border-color:var(--a1); }
.form-input[type="date"]{ color-scheme:dark; }

.type-pills{
  display:flex; flex-wrap:wrap; gap:7px; margin-bottom:14px;
}
.type-pill{
  padding:6px 12px; border-radius:8px; border:1px solid var(--border);
  background:var(--bg3); color:var(--textm); font-size:12px; cursor:pointer;
  transition:all .2s; white-space:nowrap;
}
.type-pill.selected{
  background:rgba(0,136,255,.15); border-color:var(--a1); color:var(--a2);
}

.form-row{ display:flex; gap:10px; }
.form-row .form-col{ flex:1; }

.submit-btn{
  width:100%; padding:14px; background:linear-gradient(135deg,var(--a1),var(--a2));
  border:none; border-radius:13px; color:#fff; font-size:14px; font-weight:500;
  cursor:pointer; font-family:var(--font); box-shadow:0 4px 20px rgba(0,0,0,.2);
  margin-top:4px;
}
.submit-btn:active{ transform:scale(.98); }

/* ── SLIDE IN ── */
@keyframes slideInUp{ from{opacity:0;transform:translateY(16px);} to{opacity:1;transform:translateY(0);} }
.challenge-card{ animation:slideInUp .3s ease both; }
/* ══ LIGHT THEME ══ */
html.theme-light{
  --bg:#f0f7ff; --bg2:#ffffff; --bg3:#e8f1ff;
  --a1:#0066dd; --a2:#0099ff; --t1:#0066dd; --t2:#0099ff;
  --text:#0d2137; --textm:#4a7099; --border:#c0d8f5;
  --green:#059669; --red:#dc2626; --warn:#d97706;
}
html.theme-light body{ background:var(--bg); }
html.theme-light body::before{ display:none; }
html.theme-light .tab-bar{ background:rgba(240,253,251,.97) !important; }
html.theme-light .tab-item.on{ color:var(--a1); }

/* ── PWA standalone: tab-bar sempre visibile ── */
@media all and (display-mode: standalone) {
  .tab-bar {
    position: fixed !important;
    bottom: 0 !important;
    left: 0 !important;
    right: 0 !important;
  }
  .scroll-area {
    padding-bottom: calc(64px + env(safe-area-inset-bottom, 0px)) !important;
  }
}
</style>
<script>
(function(){
  try{
    const d=JSON.parse(localStorage.getItem('fittrack_v4'));
    const th={blue:['#0088ff','#00ccff'],purple:['#7c3aed','#a855f7'],orange:['#f97316','#fbbf24'],light:['#0066dd','#0099ff']};
    const tn=(d&&d.theme)||'blue';const t=th[tn]||th.blue;
    document.documentElement.style.setProperty('--a1',t[0]);
    document.documentElement.style.setProperty('--a2',t[1]);
    if(tn==='light')document.documentElement.classList.add('theme-light');
  } catch(e){}
})();
</script>
</head>
<body>

<!-- HEADER -->
<div class="page-header">
  <div class="header-left">
    <button class="back-btn" onclick="location.href='home.html'">‹</button>
    <div class="page-title">Sfide &amp; Obiettivi</div>
  </div>
  <button class="add-btn" id="addBtn" title="Nuova sfida">＋</button>
</div>

<!-- SCROLL AREA -->
<div class="scroll-area" id="scrollArea">

  <div id="wgt-container">

  <!-- Sfide attive -->
  <div id="wgt-sfide-active">
    <div class="section-title" style="margin-top:4px;">
      <div class="section-dot" style="background:var(--a2)"></div>
      Sfide attive
    </div>
    <div id="activeList"></div>
  </div>

  <!-- Sfide completate (collapsible) -->
  <div id="wgt-sfide-completed">
    <div id="completedSection" style="display:none">
      <button class="collapse-btn" id="collapseBtn">
        <span id="collapseBtnLabel">Sfide completate</span>
        <span class="collapse-arrow" id="collapseArrow">▼</span>
      </button>
      <div id="completedList"></div>
    </div>
  </div>

  </div><!-- /wgt-container -->

</div>

<!-- TAB BAR -->
<div class="tab-bar">
  <div class="tab-item on"  onclick="location.href='home.html'">        <div class="tab-icon">🏠</div>Home</div>
  <div class="tab-item"     onclick="sfideNavigateTo('registra.html',1)"><div class="tab-icon">📝</div>Registra</div>
  <div class="tab-item"     onclick="sfideNavigateTo('peso.html',2)">    <div class="tab-icon">⚖️</div>Peso</div>
  <div class="tab-item"     onclick="sfideNavigateTo('impostazioni.html',3)"><div class="tab-icon">⚙️</div>Impost.</div>
</div>

<!-- SHEET OVERLAY -->
<div class="sheet-overlay" id="sheetOverlay"></div>

<!-- MODAL SHEET -->
<div class="sheet" id="sheet">
  <div class="sheet-handle"></div>
  <div class="sheet-inner">
    <div class="sheet-title" id="sheetTitle">Nuova Sfida</div>

    <label class="form-label">Tipo di obiettivo</label>
    <div class="type-pills" id="typePills">
      <div class="type-pill selected" data-type="sessioni">🏋️ Sessioni</div>
      <div class="type-pill" data-type="streak">🔥 Streak</div>
      <div class="type-pill" data-type="peso">⚖️ Peso</div>
      <div class="type-pill" data-type="km">🏃 Km</div>
      <div class="type-pill" data-type="kcal">🔥 Kcal</div>
      <div class="type-pill" data-type="custom">✏️ Personalizzato</div>
    </div>

    <label class="form-label">Nome sfida</label>
    <input class="form-input" id="inputName" type="text" placeholder="Es. Fai 20 sessioni questo mese" maxlength="60">

    <div class="form-row">
      <div class="form-col">
        <label class="form-label">Obiettivo (numero)</label>
        <input class="form-input" id="inputTarget" type="number" min="1" placeholder="20">
      </div>
      <div class="form-col" id="unitCol" style="display:none">
        <label class="form-label">Unità</label>
        <input class="form-input" id="inputUnit" type="text" placeholder="es. volte" maxlength="20">
      </div>
    </div>

    <label class="form-label">Scadenza</label>
    <input class="form-input" id="inputEndDate" type="date">

    <button class="submit-btn" id="submitBtn">Crea Sfida</button>
  </div>
</div>

<script>
/* ══════════════════════════════════════════
   DATI & COSTANTI
══════════════════════════════════════════ */
const STORAGE_KEY = 'fittrack_v4';

// Onboarding guard — reindirizza solo se non ci sono dati (nuovo utente)
(function(){
  try {
    var _raw = localStorage.getItem('fittrack_v4');
    if (!_raw) { location.replace('onboarding.html'); return; }
    var _d = JSON.parse(_raw);
    if ((_d.sessions && _d.sessions.length) || (_d.weightLog && _d.weightLog.length)) return;
    if (!_d.onboardingDone) location.replace('onboarding.html');
  } catch(e) { location.replace('onboarding.html'); }
})();

const TYPE_DEFAULTS = {
  sessioni: { name: 'Fai {n} sessioni questo mese',  target: 10, unit: 'sessioni', icon: '🏋️' },
  streak:   { name: 'Mantieni {n} giorni di fila',   target: 7,  unit: 'giorni',   icon: '🔥' },
  peso:     { name: 'Raggiungi {n} kg',               target: 70, unit: 'kg',       icon: '⚖️' },
  km:       { name: 'Corri {n} km questo mese',       target: 50, unit: 'km',       icon: '🏃' },
  kcal:     { name: 'Brucia {n} kcal questa settimana',target:5000,unit: 'kcal',    icon: '🔥' },
  custom:   { name: 'La mia sfida',                   target: 10, unit: '',         icon: '✏️' },
};

function loadData(){
  try{ return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
  catch(e){ return {}; }
}
function saveData(d){ localStorage.setItem(STORAGE_KEY, JSON.stringify(d)); }

/* ══════════════════════════════════════════
   CALCOLO AUTOMATICO current
══════════════════════════════════════════ */
function calcCurrent(challenge, appData){
  const sessions = appData.sessions || [];
  /* fallback: usa l'ID come timestamp di creazione (id = Date.now()) */
  const sDate = challenge.startDate
    ? new Date(challenge.startDate + 'T00:00')
    : new Date(challenge.id || Date.now());
  const eDate = challenge.endDate   ? new Date(challenge.endDate   + 'T23:59') : new Date('9999-12-31');

  const inRange = s => {
    const d = new Date(s.date + 'T12:00');
    return d >= sDate && d <= eDate;
  };

  switch(challenge.type){
    case 'sessioni':
      return sessions.filter(inRange).length;
    case 'streak':
      return appData.streak || 0;
    case 'peso':
      return appData.currentWeight || 0;
    case 'kcal':
      return sessions.filter(inRange).reduce((a, s) => a + (s.kcal || 0), 0);
    case 'km':
      return sessions.filter(inRange).reduce((a, s) => a + (s.km || 0), 0);
    case 'custom':
    default:
      return challenge.manualCurrent != null ? challenge.manualCurrent : (challenge.current || 0);
  }
}

function updateAllCurrents(){
  const d = loadData();
  if(!Array.isArray(d.challenges)) return d;
  d.challenges = d.challenges.map(c => {
    const newCur = calcCurrent(c, d);
    // Per tipo custom non sovrascrivere se non null
    if(c.type !== 'custom'){
      c.current = newCur;
      // Segna come completata se raggiunta
      if(!c.completed && c.current >= c.target) c.completed = true;
    } else {
      if(c.manualCurrent != null){
        c.current = c.manualCurrent;
        if(!c.completed && c.current >= c.target) c.completed = true;
      }
    }
    return c;
  });
  saveData(d);
  return d;
}

/* ══════════════════════════════════════════
   RENDER
══════════════════════════════════════════ */
function daysLeft(endDate){
  if(!endDate) return null;
  const today = new Date(); today.setHours(0,0,0,0);
  const end   = new Date(endDate + 'T00:00');
  return Math.round((end - today) / 86400000);
}

function deadlineLabel(days){
  if(days === null) return '';
  if(days < 0)  return { text: 'Scaduta',     cls: 'expired' };
  if(days === 0) return { text: 'Scade oggi',  cls: 'urgent' };
  if(days <= 3)  return { text: `${days}g rimanenti`, cls: 'urgent' };
  return { text: `${days} giorni rimasti`, cls: '' };
}

function renderChallenge(c, isCompleted){
  const cur = c.current || 0;
  const target = c.target || 1;
  const pct  = Math.min(100, Math.round(cur / target * 100));
  const days = daysLeft(c.endDate);
  const dl   = deadlineLabel(days);
  const fillCls = pct >= 100 ? 'done-fill' : '';
  const isCustom = c.type === 'custom';
  const unitLabel = c.unit || '';
  const manualRow = isCustom && !isCompleted ? `
    <div class="ch-manual-row">
      <span class="ch-manual-label">Aggiorna progresso manuale</span>
      <input class="ch-manual-input" type="number" min="0"
        value="${c.manualCurrent != null ? c.manualCurrent : ''}"
        placeholder="0"
        onchange="updateManual('${c.id}', this.value)"
        onclick="event.stopPropagation()">
    </div>` : '';
  const doneBadge = isCompleted ? `<div class="ch-done-badge">✓ Completata</div>` : '';

  return `<div class="challenge-card${isCompleted ? ' completed-card' : ''}">
    <div class="ch-top">
      <div class="ch-left">
        <div class="ch-icon">${c.icon || '🏆'}</div>
        <div class="ch-info">
          <div class="ch-name">${c.name}</div>
          ${dl ? `<div class="ch-deadline ${dl.cls}">${dl.text}</div>` : ''}
        </div>
      </div>
      <div class="ch-right">
        <span class="ch-pct">${pct}%</span>
        <button class="ch-delete" onclick="deleteChallenge('${c.id}')" title="Elimina">✕</button>
      </div>
    </div>
    <div class="ch-progress-row">
      <span class="ch-prog-label">${unitLabel ? cur + ' / ' + target + ' ' + unitLabel : cur + ' / ' + target}</span>
    </div>
    <div class="ch-prog-bg">
      <div class="ch-prog-fill ${fillCls}" style="width:${pct}%"></div>
    </div>
    ${manualRow}
    ${doneBadge}
  </div>`;
}

function renderAll(){
  const d = updateAllCurrents();
  const challenges = d.challenges || [];
  const active    = challenges.filter(c => !c.completed);
  const completed = challenges.filter(c =>  c.completed);

  const activeList = document.getElementById('activeList');
  const completedList = document.getElementById('completedList');
  const completedSection = document.getElementById('completedSection');

  if(active.length === 0){
    activeList.innerHTML = `<div class="empty-state">
      <div class="empty-icon">🏆</div>
      <div class="empty-title">Nessuna sfida attiva</div>
      <div class="empty-sub">Tocca ＋ in alto per creare la tua prima sfida e inizia a raggiungere i tuoi obiettivi.</div>
    </div>`;
  } else {
    // Ordina per urgenza
    const sorted = [...active].sort((a,b)=>{
      const da = a.endDate ? new Date(a.endDate) : new Date('9999-12-31');
      const db = b.endDate ? new Date(b.endDate) : new Date('9999-12-31');
      return da - db;
    });
    activeList.innerHTML = sorted.map(c => renderChallenge(c, false)).join('');
  }

  if(completed.length > 0){
    completedSection.style.display = 'block';
    document.getElementById('collapseBtnLabel').textContent =
      `Sfide completate (${completed.length})`;
    completedList.innerHTML = completed.map(c => renderChallenge(c, true)).join('');
  } else {
    completedSection.style.display = 'none';
  }
}

function deleteChallenge(id){
  const d = loadData();
  if(!Array.isArray(d.challenges)) return;
  d.challenges = d.challenges.filter(c => String(c.id) !== String(id));
  saveData(d);
  renderAll();
}

function updateManual(id, val){
  const d = loadData();
  if(!Array.isArray(d.challenges)) return;
  const c = d.challenges.find(c => String(c.id) === String(id));
  if(!c) return;
  const num = parseFloat(val);
  c.manualCurrent = isNaN(num) ? 0 : num;
  c.current = c.manualCurrent;
  if(!c.completed && c.current >= c.target) c.completed = true;
  saveData(d);
  renderAll();
}

let completedOpen = false;
document.getElementById('collapseBtn').addEventListener('click', () => {
  completedOpen = !completedOpen;
  document.getElementById('completedList').style.display = completedOpen ? 'block' : 'none';
  document.getElementById('collapseArrow').classList.toggle('open', completedOpen);
});

/* ══════════════════════════════════════════
   MODAL SHEET
══════════════════════════════════════════ */
let selectedType = 'sessioni';
let editingId = null;

function openSheet(resetForm = true){
  if(resetForm){
    editingId = null;
    document.getElementById('sheetTitle').textContent = 'Nuova Sfida';
    document.getElementById('submitBtn').textContent = 'Crea Sfida';
    setType('sessioni');
    document.getElementById('inputName').value = '';
    document.getElementById('inputTarget').value = '';
    document.getElementById('inputUnit').value = '';
    // Default endDate = fine del mese corrente
    const now = new Date();
    const lastDay = new Date(now.getFullYear(), now.getMonth()+1, 0);
    document.getElementById('inputEndDate').value = lastDay.toISOString().split('T')[0];
  }
  document.getElementById('sheet').classList.add('open');
  document.getElementById('sheetOverlay').classList.add('visible');
}

function closeSheet(){
  document.getElementById('sheet').classList.remove('open');
  document.getElementById('sheetOverlay').classList.remove('visible');
}

document.getElementById('addBtn').addEventListener('click', () => openSheet(true));
document.getElementById('sheetOverlay').addEventListener('click', closeSheet);

function setType(type){
  selectedType = type;
  document.querySelectorAll('.type-pill').forEach(p => {
    p.classList.toggle('selected', p.dataset.type === type);
  });
  const def = TYPE_DEFAULTS[type] || TYPE_DEFAULTS.custom;
  // Aggiorna nome solo se vuoto o era un default
  const nameInput = document.getElementById('inputName');
  const isEmpty = !nameInput.value.trim();
  const wasDefault = Object.values(TYPE_DEFAULTS).some(d =>
    nameInput.value === d.name.replace('{n}', document.getElementById('inputTarget').value || d.target)
    || nameInput.value === d.name.replace('{n}', d.target)
  );
  if(isEmpty || wasDefault){
    const t = document.getElementById('inputTarget').value || def.target;
    nameInput.value = def.name.replace('{n}', t);
  }
  if(isEmpty && !document.getElementById('inputTarget').value){
    document.getElementById('inputTarget').value = def.target;
  }
  // Mostra/nascondi campo unità custom
  document.getElementById('unitCol').style.display = type === 'custom' ? 'flex' : 'none';
}

document.querySelectorAll('.type-pill').forEach(p => {
  p.addEventListener('click', () => setType(p.dataset.type));
});

// Aggiorna nome suggerito quando cambia il target
document.getElementById('inputTarget').addEventListener('input', function(){
  const def = TYPE_DEFAULTS[selectedType] || TYPE_DEFAULTS.custom;
  const nameInput = document.getElementById('inputName');
  const wasDefault = Object.values(TYPE_DEFAULTS).some(d =>
    nameInput.value === d.name.replace('{n}', d.target)
    || nameInput.value.match(/^[^0-9]*\d+[^0-9]*$/)
  );
  if(wasDefault || !nameInput.value.trim()){
    nameInput.value = def.name.replace('{n}', this.value || def.target);
  }
});

document.getElementById('submitBtn').addEventListener('click', () => {
  const name = document.getElementById('inputName').value.trim();
  const target = parseFloat(document.getElementById('inputTarget').value);
  const endDate = document.getElementById('inputEndDate').value;

  if(!name){ document.getElementById('inputName').focus(); return; }
  if(isNaN(target) || target <= 0){ document.getElementById('inputTarget').focus(); return; }

  const def = TYPE_DEFAULTS[selectedType] || TYPE_DEFAULTS.custom;
  let unit = def.unit;
  if(selectedType === 'custom'){
    unit = document.getElementById('inputUnit').value.trim() || 'unità';
  }

  const d = loadData();
  if(!Array.isArray(d.challenges)) d.challenges = [];

  if(editingId){
    const idx = d.challenges.findIndex(c => String(c.id) === String(editingId));
    if(idx !== -1){
      d.challenges[idx] = Object.assign(d.challenges[idx], { name, target, unit, endDate,
        icon: def.icon, type: selectedType });
    }
  } else {
    const now2 = new Date();
    const startDate = now2.toISOString().split('T')[0];
    d.challenges.push({
      id: Date.now(),
      name,
      type: selectedType,
      target,
      unit,
      current: 0,
      manualCurrent: null,
      startDate,
      endDate,
      completed: false,
      icon: def.icon,
    });
  }
  saveData(d);
  closeSheet();
  renderAll();
});
