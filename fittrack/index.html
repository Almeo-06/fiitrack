<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#060610">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FitTrack">
<meta name="description" content="Traccia i tuoi allenamenti quotidiani">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>FitTrack · Il Tuo Progresso</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Syne+Mono&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #060610;
  --surface: #0e0e1e;
  --surface2: #161628;
  --border: #1e1e38;
  --border2: #2a2a48;
  --fire: #ff4d00;
  --fire2: #ff8c00;
  --green: #00e676;
  --blue: #2979ff;
  --purple: #aa00ff;
  --text: #eeeef8;
  --muted: #5a5a80;
  --muted2: #8888aa;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Outfit', sans-serif;
  min-height: 100vh;
  padding-bottom: 40px;
  -webkit-tap-highlight-color: transparent;
}
body::before {
  content:'';
  position:fixed; inset:0;
  background: radial-gradient(ellipse 80% 50% at 50% -20%, rgba(41,121,255,0.08), transparent),
              radial-gradient(ellipse 60% 40% at 80% 80%, rgba(255,77,0,0.05), transparent);
  pointer-events:none; z-index:0;
}
.app { max-width: 480px; margin: 0 auto; padding: 24px 16px; position:relative; z-index:1; }

/* HEADER */
.header { display:flex; align-items:center; justify-content:space-between; margin-bottom:28px; animation: slideDown 0.6s ease both; }
.logo { font-family:'Syne',sans-serif; font-weight:800; font-size:22px; letter-spacing:-0.5px; }
.logo span { color:var(--fire); }
.date-badge { font-family:'Syne Mono',monospace; font-size:11px; color:var(--muted2); background:var(--surface); border:1px solid var(--border); padding:5px 10px; border-radius:6px; }

/* STREAK */
.streak-card {
  background: linear-gradient(135deg, #1a0a00, #0e0e1e);
  border: 1px solid rgba(255,77,0,0.3);
  border-radius: 20px; padding: 24px;
  margin-bottom: 16px;
  display: flex; align-items: center; gap: 20px;
  position: relative; overflow: hidden;
  animation: slideUp 0.6s ease 0.1s both;
}
.streak-card::before {
  content:''; position:absolute; top:-30px; right:-30px;
  width:120px; height:120px;
  background: radial-gradient(circle, rgba(255,77,0,0.15), transparent 70%);
}
.streak-flame { font-size:52px; line-height:1; filter: drop-shadow(0 0 12px rgba(255,140,0,0.6)); }
.streak-info { flex:1; }
.streak-num {
  font-family:'Syne',sans-serif; font-size:52px; font-weight:800; line-height:1;
  background: linear-gradient(135deg, var(--fire), var(--fire2));
  -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
}
.streak-label { font-size:13px; color:var(--muted2); margin-top:2px; }
.streak-best { font-family:'Syne Mono',monospace; font-size:11px; color:var(--muted); margin-top:6px; }
.streak-dots { display:flex; gap:5px; margin-top:10px; }
.sdot { width:28px; height:6px; border-radius:3px; background:var(--border2); transition:all 0.3s ease; }
.sdot.active { background: linear-gradient(90deg, var(--fire), var(--fire2)); }
.sdot.today { background:var(--fire); box-shadow:0 0 8px var(--fire); }

/* RECAP */
.recap-card { background:var(--surface); border:1px solid var(--border); border-radius:20px; padding:20px; margin-bottom:16px; animation: slideUp 0.6s ease 0.2s both; }
.card-title { font-family:'Syne',sans-serif; font-size:12px; font-weight:700; letter-spacing:2px; text-transform:uppercase; color:var(--muted2); margin-bottom:16px; display:flex; align-items:center; gap:8px; }
.card-title .dot { width:6px; height:6px; border-radius:50%; background:var(--green); }
.recap-stats { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
.rstat { background:var(--surface2); border:1px solid var(--border); border-radius:12px; padding:14px 10px; text-align:center; }
.rstat-val { font-family:'Syne',sans-serif; font-size:24px; font-weight:800; }
.rstat-val.fire { color:var(--fire); }
.rstat-val.green { color:var(--green); }
.rstat-val.blue { color:var(--blue); }
.rstat-lbl { font-size:10px; color:var(--muted); margin-top:3px; text-transform:uppercase; letter-spacing:1px; }
.week-bars { display:flex; gap:6px; align-items:flex-end; height:60px; margin-top:16px; }
.bar-wrap { flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; height:100%; justify-content:flex-end; }
.bar { width:100%; border-radius:4px 4px 0 0; background:var(--border2); transition:height 0.5s ease; min-height:4px; cursor:pointer; }
.bar.has-data { background: linear-gradient(180deg, var(--fire2), var(--fire)); }
.bar.today-bar { background: linear-gradient(180deg, #ffcc00, var(--fire2)); box-shadow:0 0 10px rgba(255,140,0,0.4); }
.bar-day { font-family:'Syne Mono',monospace; font-size:9px; color:var(--muted); text-transform:uppercase; }

/* LOG */
.log-card { background:var(--surface); border:1px solid var(--border); border-radius:20px; padding:20px; margin-bottom:16px; animation: slideUp 0.6s ease 0.3s both; }
.day-select { display:flex; gap:6px; margin-bottom:16px; flex-wrap:wrap; }
.day-btn { flex:1; min-width:40px; background:var(--surface2); border:1px solid var(--border); border-radius:8px; padding:8px 4px; color:var(--muted2); font-family:'Syne Mono',monospace; font-size:10px; text-align:center; cursor:pointer; transition:all 0.2s; display:flex; flex-direction:column; align-items:center; gap:3px; }
.day-btn .day-abbr { font-size:9px; text-transform:uppercase; }
.day-btn .day-type { font-size:14px; }
.day-btn:hover { border-color:var(--border2); }
.day-btn.selected { background:rgba(41,121,255,0.1); border-color:var(--blue); color:var(--blue); }
.day-btn.logged { background:rgba(0,230,118,0.08); border-color:rgba(0,230,118,0.3); color:var(--green); }
.type-toggle { display:flex; gap:6px; margin-bottom:14px; }
.type-btn { flex:1; padding:10px; background:var(--surface2); border:1px solid var(--border); border-radius:10px; color:var(--muted2); font-family:'Outfit',sans-serif; font-size:13px; font-weight:500; cursor:pointer; transition:all 0.2s; text-align:center; }
.type-btn.active-run { background:rgba(62,255,206,0.08); border-color:rgba(62,255,206,0.4); color:#3effce; }
.type-btn.active-gym { background:rgba(255,77,0,0.08); border-color:rgba(255,77,0,0.3); color:var(--fire2); }
.input-group { margin-bottom:12px; }
.input-label { font-size:11px; color:var(--muted2); text-transform:uppercase; letter-spacing:1px; margin-bottom:6px; display:block; }
.input-row { display:flex; gap:8px; }
.inp { flex:1; background:var(--surface2); border:1px solid var(--border); border-radius:10px; padding:12px 14px; color:var(--text); font-family:'Outfit',sans-serif; font-size:15px; outline:none; transition:border 0.2s; }
.inp:focus { border-color:var(--blue); }
.inp::placeholder { color:var(--muted); }
.km-row { display:none; }
.km-row.visible { display:flex; }
.log-btn { width:100%; background:linear-gradient(135deg, var(--fire), var(--fire2)); border:none; border-radius:12px; padding:14px; color:#fff; font-family:'Syne',sans-serif; font-size:14px; font-weight:700; letter-spacing:1px; text-transform:uppercase; cursor:pointer; transition:all 0.2s; box-shadow:0 4px 20px rgba(255,77,0,0.3); }
.log-btn:hover { transform:translateY(-1px); box-shadow:0 6px 24px rgba(255,77,0,0.4); }
.log-btn:active { transform:translateY(0); }

/* HISTORY */
.history-card { background:var(--surface); border:1px solid var(--border); border-radius:20px; padding:20px; animation: slideUp 0.6s ease 0.4s both; }
.session-list { display:flex; flex-direction:column; gap:8px; max-height:300px; overflow-y:auto; }
.session-list::-webkit-scrollbar { width:3px; }
.session-list::-webkit-scrollbar-thumb { background:var(--border2); border-radius:2px; }
.session-item { background:var(--surface2); border:1px solid var(--border); border-radius:12px; padding:12px 14px; display:flex; align-items:center; gap:12px; animation: fadeIn 0.3s ease both; }
.session-icon { font-size:20px; flex-shrink:0; }
.session-info { flex:1; }
.session-day { font-size:13px; font-weight:600; }
.session-meta { font-size:11px; color:var(--muted2); margin-top:2px; }
.session-kcal { font-family:'Syne',sans-serif; font-size:16px; font-weight:700; color:var(--fire2); }
.session-del { background:none; border:none; color:var(--muted); cursor:pointer; font-size:14px; padding:4px; transition:color 0.2s; }
.session-del:hover { color:#ff4444; }
.empty-state { text-align:center; padding:30px; color:var(--muted); font-size:13px; }
.empty-state .emoji { font-size:32px; display:block; margin-bottom:8px; }

/* BACKUP */
.backup-row { display:flex; gap:8px; margin-top:14px; }
.backup-btn { flex:1; padding:10px; background:var(--surface2); border:1px solid var(--border); border-radius:10px; color:var(--muted2); font-family:'Outfit',sans-serif; font-size:12px; cursor:pointer; transition:all 0.2s; text-align:center; }
.backup-btn:hover { border-color:var(--border2); color:var(--text); }

/* TOAST */
.toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(80px); background:var(--surface2); border:1px solid var(--border2); border-radius:12px; padding:12px 20px; font-size:14px; font-weight:500; box-shadow:0 8px 32px rgba(0,0,0,0.4); transition:transform 0.4s cubic-bezier(0.34,1.56,0.64,1); z-index:100; white-space:nowrap; }
.toast.show { transform:translateX(-50%) translateY(0); }
.toast.success { border-color:rgba(0,230,118,0.3); color:var(--green); }
.toast.fire { border-color:rgba(255,77,0,0.3); color:var(--fire2); }

/* INSTALL BANNER */
.install-banner { background:linear-gradient(135deg, rgba(41,121,255,0.1), rgba(170,0,255,0.08)); border:1px solid rgba(41,121,255,0.3); border-radius:16px; padding:14px 16px; margin-bottom:16px; display:flex; align-items:center; gap:12px; cursor:pointer; animation: slideUp 0.6s ease both; }
.install-banner.hidden { display:none; }
.install-icon { font-size:24px; }
.install-text { flex:1; }
.install-text strong { font-size:13px; display:block; }
.install-text span { font-size:11px; color:var(--muted2); }
.install-close { background:none; border:none; color:var(--muted); cursor:pointer; font-size:16px; }

@keyframes slideDown { from{opacity:0;transform:translateY(-16px)} to{opacity:1;transform:translateY(0)} }
@keyframes slideUp { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }
@keyframes fadeIn { from{opacity:0} to{opacity:1} }
</style>
</head>
<body>
<div class="app">

  <div class="header">
    <div class="logo">Fit<span>Track</span></div>
    <div class="date-badge" id="dateBadge"></div>
  </div>

  <!-- Install Banner -->
  <div class="install-banner hidden" id="installBanner">
    <div class="install-icon">📲</div>
    <div class="install-text">
      <strong>Installa FitTrack</strong>
      <span>Aggiungila alla schermata home!</span>
    </div>
    <button class="install-close" onclick="dismissInstall()">✕</button>
  </div>

  <!-- Streak -->
  <div class="streak-card">
    <div class="streak-flame" id="streakFlame">🔥</div>
    <div class="streak-info">
      <div class="streak-num" id="streakNum">0</div>
      <div class="streak-label">giorni di fila</div>
      <div class="streak-best" id="streakBest">Record: 0 giorni</div>
      <div class="streak-dots" id="streakDots"></div>
    </div>
  </div>

  <!-- Weekly Recap -->
  <div class="recap-card">
    <div class="card-title"><span class="dot"></span>Recap Settimana</div>
    <div class="recap-stats">
      <div class="rstat"><div class="rstat-val fire" id="totalKcal">0</div><div class="rstat-lbl">kcal totali</div></div>
      <div class="rstat"><div class="rstat-val green" id="totalSessions">0</div><div class="rstat-lbl">sessioni</div></div>
      <div class="rstat"><div class="rstat-val blue" id="totalKm">0</div><div class="rstat-lbl">km corsi</div></div>
    </div>
    <div class="week-bars" id="weekBars"></div>
  </div>

  <!-- Log Session -->
  <div class="log-card">
    <div class="card-title"><span class="dot" style="background:var(--blue)"></span>Aggiungi Sessione</div>
    <div class="day-select" id="daySelect"></div>
    <div class="type-toggle">
      <button class="type-btn" id="btnRun" onclick="setType('run')">🏃 Corsa</button>
      <button class="type-btn" id="btnGym" onclick="setType('gym')">🏋️ Palestra</button>
    </div>
    <div class="input-group">
      <label class="input-label">Calorie Bruciate (kcal)</label>
      <input class="inp" type="number" id="kcalInput" placeholder="es. 320" min="0" max="2000">
    </div>
    <div class="input-group km-row" id="kmRow">
      <label class="input-label">Distanza Percorsa</label>
      <div class="input-row">
        <input class="inp" type="number" id="kmInput" placeholder="es. 3.5" min="0" max="100" step="0.1">
        <select class="inp" id="kmUnit" style="max-width:80px"><option value="km">km</option><option value="m">m</option></select>
      </div>
    </div>
    <div class="input-group">
      <label class="input-label">Note (opzionale)</label>
      <input class="inp" type="text" id="noteInput" placeholder="es. Corsa al parco...">
    </div>
    <button class="log-btn" onclick="logSession()">⚡ REGISTRA SESSIONE</button>
    <div class="backup-row">
      <button class="backup-btn" onclick="exportData()">💾 Esporta backup</button>
      <button class="backup-btn" onclick="document.getElementById('importFile').click()">📂 Importa backup</button>
      <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)">
    </div>
  </div>

  <!-- History -->
  <div class="history-card">
    <div class="card-title" style="justify-content:space-between">
      <span style="display:flex;align-items:center;gap:8px"><span class="dot" style="background:var(--purple)"></span>Storico</span>
      <span style="font-size:10px;color:var(--muted);cursor:pointer;text-decoration:underline" onclick="confirmClear()">Azzera tutto</span>
    </div>
    <div class="session-list" id="sessionList"></div>
  </div>

</div>
<div class="toast" id="toast"></div>

<script>
const DAYS = [
  { abbr:'Lun', label:'Lunedì',    type:'rest', icon:'😴' },
  { abbr:'Mar', label:'Martedì',   type:'rest', icon:'😴' },
  { abbr:'Mer', label:'Mercoledì', type:'run',  icon:'🏃' },
  { abbr:'Gio', label:'Giovedì',   type:'run',  icon:'🏃' },
  { abbr:'Ven', label:'Venerdì',   type:'gym',  icon:'🏋️' },
  { abbr:'Sab', label:'Sabato',    type:'gym',  icon:'🏋️' },
  { abbr:'Dom', label:'Domenica',  type:'gym',  icon:'🏋️' },
];

const KEY = 'fittrack_v2';
function loadData() {
  try { return JSON.parse(localStorage.getItem(KEY)) || { sessions:[], streak:0, bestStreak:0, lastDate:null }; }
  catch { return { sessions:[], streak:0, bestStreak:0, lastDate:null }; }
}
function saveData(d) { localStorage.setItem(KEY, JSON.stringify(d)); }

let data = loadData();
let selectedDay = ((new Date().getDay()+6)%7);
let selectedType = 'run';
let deferredPrompt = null;

// PWA install prompt
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById('installBanner').classList.remove('hidden');
});

document.getElementById('installBanner').addEventListener('click', async (e) => {
  if (e.target.classList.contains('install-close')) return;
  if (deferredPrompt) {
    deferredPrompt.prompt();
    const { outcome } = await deferredPrompt.userChoice;
    if (outcome === 'accepted') showToast('App installata! 🎉', 'success');
    deferredPrompt = null;
    document.getElementById('installBanner').classList.add('hidden');
  }
});

function dismissInstall() {
  document.getElementById('installBanner').classList.add('hidden');
}

window.addEventListener('appinstalled', () => {
  document.getElementById('installBanner').classList.add('hidden');
  showToast('FitTrack installata! 🎉', 'success');
});

function init() {
  document.getElementById('dateBadge').textContent = new Date().toLocaleDateString('it-IT',{weekday:'short',day:'numeric',month:'short'});
  buildDaySelect(); buildWeekBars(); renderStreak(); renderRecap(); renderHistory();
  setType(DAYS[selectedDay].type === 'rest' ? 'gym' : DAYS[selectedDay].type);
}

function buildDaySelect() {
  const el = document.getElementById('daySelect'); el.innerHTML='';
  const today = ((new Date().getDay()+6)%7);
  DAYS.forEach((d,i) => {
    const hasLog = data.sessions.some(s => s.dayIndex===i && isThisWeek(s.date));
    const btn = document.createElement('button');
    btn.className = 'day-btn'+(i===selectedDay?' selected':'')+(hasLog?' logged':'');
    btn.innerHTML = `<span class="day-abbr">${d.abbr}</span><span class="day-type">${hasLog?'✅':d.icon}</span>`;
    btn.onclick = () => selectDay(i);
    if (i===today) btn.style.boxShadow='0 0 0 1px rgba(255,220,0,0.3)';
    el.appendChild(btn);
  });
}

function selectDay(i) { selectedDay=i; buildDaySelect(); const t=DAYS[i].type; setType(t==='rest'?'gym':t); }

function setType(t) {
  selectedType=t;
  document.getElementById('btnRun').className='type-btn'+(t==='run'?' active-run':'');
  document.getElementById('btnGym').className='type-btn'+(t==='gym'?' active-gym':'');
  document.getElementById('kmRow').className='input-group km-row'+(t==='run'?' visible':'');
}

function logSession() {
  const kcal = parseFloat(document.getElementById('kcalInput').value);
  if (!kcal||kcal<=0) { showToast('Inserisci le calorie bruciate!','fire'); return; }
  const km = selectedType==='run' ? parseFloat(document.getElementById('kmInput').value)||0 : 0;
  const kmUnit = document.getElementById('kmUnit').value;
  const note = document.getElementById('noteInput').value.trim();
  const kmFinal = kmUnit==='m' ? km/1000 : km;
  const today = new Date().toISOString().split('T')[0];
  data.sessions.unshift({ id:Date.now(), date:today, dayIndex:selectedDay, dayLabel:DAYS[selectedDay].label, type:selectedType, kcal:Math.round(kcal), km:kmFinal, note });
  updateStreak(today);
  saveData(data);
  document.getElementById('kcalInput').value='';
  document.getElementById('kmInput').value='';
  document.getElementById('noteInput').value='';
  buildDaySelect(); buildWeekBars(); renderStreak(); renderRecap(); renderHistory();
  showToast('Sessione registrata! 💪','success');
}

function updateStreak(todayStr) {
  const yesterday = new Date(); yesterday.setDate(yesterday.getDate()-1);
  const yStr = yesterday.toISOString().split('T')[0];
  if (data.lastDate===todayStr) return;
  data.streak = (data.lastDate===yStr) ? data.streak+1 : 1;
  data.lastDate = todayStr;
  if (data.streak>data.bestStreak) data.bestStreak=data.streak;
}

function renderStreak() {
  document.getElementById('streakNum').textContent=data.streak;
  document.getElementById('streakBest').textContent=`Record: ${data.bestStreak} giorni`;
  document.getElementById('streakFlame').textContent = data.streak>=30?'🔥🔥🔥':data.streak>=14?'🔥🔥':'🔥';
  const dotsEl=document.getElementById('streakDots'); dotsEl.innerHTML='';
  const today=new Date().toISOString().split('T')[0];
  for(let i=6;i>=0;i--) {
    const d=new Date(); d.setDate(d.getDate()-i);
    const ds=d.toISOString().split('T')[0];
    const has=data.sessions.some(s=>s.date===ds);
    const dot=document.createElement('div');
    dot.className='sdot'+(has?(ds===today?' today':' active'):'');
    dotsEl.appendChild(dot);
  }
}

function isThisWeek(dateStr) {
  const d=new Date(dateStr), now=new Date();
  const sow=new Date(now); sow.setDate(now.getDate()-((now.getDay()+6)%7)); sow.setHours(0,0,0,0);
  return d>=sow;
}

function renderRecap() {
  const w=data.sessions.filter(s=>isThisWeek(s.date));
  document.getElementById('totalKcal').textContent=w.reduce((a,s)=>a+s.kcal,0).toLocaleString('it');
  document.getElementById('totalSessions').textContent=w.length;
  const km=w.reduce((a,s)=>a+s.km,0);
  document.getElementById('totalKm').textContent=km>0?km.toFixed(1):'0';
}

function buildWeekBars() {
  const el=document.getElementById('weekBars'); el.innerHTML='';
  const today=((new Date().getDay()+6)%7);
  const kcalPerDay=DAYS.map((_,i)=>{
    const d=new Date(); d.setDate(d.getDate()+(i-today));
    const ds=d.toISOString().split('T')[0];
    return data.sessions.filter(s=>s.date===ds).reduce((a,s)=>a+s.kcal,0);
  });
  const maxKcal=Math.max(...kcalPerDay,1);
  DAYS.forEach((day,i)=>{
    const wrap=document.createElement('div'); wrap.className='bar-wrap';
    const pct=Math.round((kcalPerDay[i]/maxKcal)*52);
    const bar=document.createElement('div');
    bar.className='bar'+(kcalPerDay[i]>0?' has-data':'')+(i===today?' today-bar':'');
    bar.style.height=(pct||4)+'px';
    bar.title=`${day.label}: ${kcalPerDay[i]} kcal`;
    const label=document.createElement('div'); label.className='bar-day'; label.textContent=day.abbr.substring(0,2);
    wrap.appendChild(bar); wrap.appendChild(label); el.appendChild(wrap);
  });
}

function renderHistory() {
  const el=document.getElementById('sessionList');
  if(!data.sessions.length) { el.innerHTML=`<div class="empty-state"><span class="emoji">📊</span>Nessuna sessione ancora.<br>Registra il tuo primo allenamento!</div>`; return; }
  el.innerHTML='';
  data.sessions.slice(0,30).forEach(s=>{
    const item=document.createElement('div'); item.className='session-item';
    const kmText=s.km>0?` · ${s.km.toFixed(1)} km`:'';
    const noteText=s.note?` · "${s.note}"`:'';
    const dateStr=new Date(s.date).toLocaleDateString('it-IT',{day:'numeric',month:'short'});
    item.innerHTML=`
      <div class="session-icon">${s.type==='run'?'🏃':'🏋️'}</div>
      <div class="session-info">
        <div class="session-day">${s.dayLabel} <span style="color:var(--muted);font-size:11px;font-weight:400">${dateStr}</span></div>
        <div class="session-meta">${s.type==='run'?'Corsa':'Palestra'}${kmText}${noteText}</div>
      </div>
      <div class="session-kcal">${s.kcal.toLocaleString()}<span style="font-size:10px;color:var(--muted);font-weight:400"> kcal</span></div>
      <button class="session-del" onclick="deleteSession(${s.id})">✕</button>`;
    el.appendChild(item);
  });
}

function deleteSession(id) {
  data.sessions=data.sessions.filter(s=>s.id!==id);
  saveData(data); buildDaySelect(); buildWeekBars(); renderRecap(); renderHistory();
  showToast('Sessione eliminata','');
}

function confirmClear() {
  if(confirm('Sei sicuro? Verranno cancellate tutte le sessioni e lo streak.')) {
    data={ sessions:[], streak:0, bestStreak:0, lastDate:null };
    saveData(data); init(); showToast('Dati azzerati','');
  }
}

function exportData() {
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download=`fittrack_backup_${new Date().toISOString().split('T')[0]}.json`;
  a.click(); showToast('Backup esportato! 💾','success');
}

function importData(e) {
  const file=e.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=ev=>{
    try {
      const imported=JSON.parse(ev.target.result);
      if(imported.sessions) { data=imported; saveData(data); init(); showToast('Backup importato! ✅','success'); }
      else showToast('File non valido','fire');
    } catch { showToast('Errore importazione','fire'); }
  };
  reader.readAsText(file);
}

function showToast(msg,type) {
  const t=document.getElementById('toast'); t.textContent=msg;
  t.className='toast '+type;
  setTimeout(()=>t.classList.add('show'),10);
  setTimeout(()=>t.classList.remove('show'),2800);
}

if('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}

init();
</script>
</body>
</html>
