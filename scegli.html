<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>FitTrack · Scegli allenamento</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#020810">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FitTrack">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>
(function(){
  try{
    var d=JSON.parse(localStorage.getItem('fittrack_v4'));if(d&&d.theme==='orange'){d.theme='light';try{localStorage.setItem('fittrack_v4',JSON.stringify(d));}catch(e){}}
    var th={blue:['#0088ff','#00ccff'],purple:['#7c3aed','#a855f7'],light:['#0066dd','#0099ff']};
    var tn=(d&&d.theme)||'light';var t=th[tn]||th.light;
    document.documentElement.style.setProperty('--a1',t[0]);
    document.documentElement.style.setProperty('--a2',t[1]);
    if(tn==='light')document.documentElement.classList.add('theme-light');var rgb={blue:'0,136,255',purple:'124,58,237',light:'0,102,221'};document.documentElement.style.setProperty('--a1-rgb',rgb[tn]||rgb.light);var mc=document.querySelector('meta[name=theme-color]');if(mc)mc.content=tn==='light'?'#dce8ff':'#020810';
  }catch(e){}
})();
</script>
<style>
:root{
  --bg:#020810; --bg2:#060d1a; --bg3:#0a1428;
  --a1:#0088ff; --a2:#00ccff;
  --text:#e0f4ff; --textm:#304870; --border:#0d1e38;
  --green:#00e676; --font:'DM Sans',sans-serif; --mono:'DM Mono',monospace;
}
*{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html{ height:-webkit-fill-available; }
body{
  background:var(--bg); color:var(--text); font-family:var(--font);
  max-width:480px; margin:0 auto;
  min-height:100vh; min-height:100dvh; min-height:-webkit-fill-available;
  display:flex; flex-direction:column;
}

/* header */
.hdr{
  display:flex; align-items:center; gap:12px;
  padding:16px 20px 14px; border-bottom:1px solid var(--border);
  flex-shrink:0;
}
.back-btn{
  width:36px; height:36px; border-radius:50%; background:var(--bg3);
  border:1px solid var(--border); color:var(--textm); font-size:16px;
  display:flex; align-items:center; justify-content:center; cursor:pointer;
  flex-shrink:0;
}
.hdr-title{ font-size:16px; font-weight:600; color:var(--text); }
.hdr-sub{ font-size:11px; color:var(--textm); margin-top:1px; }

/* scroll */
.scroll-area{ flex:1; overflow-y:auto; padding:20px 16px calc(120px + env(safe-area-inset-bottom, 0px)); -webkit-overflow-scrolling:touch; }
.scroll-area::-webkit-scrollbar{ width:0; }

/* sezione */
.section-lbl{
  font-family:var(--mono); font-size:9px; color:var(--textm);
  letter-spacing:2px; text-transform:uppercase;
  display:flex; align-items:center; gap:8px;
  margin-bottom:10px; margin-top:24px;
}
.section-lbl:first-child{ margin-top:0; }
.section-lbl::after{
  content:''; flex:1; height:1px; background:var(--border);
}

/* card allenamento */
.wo-card{
  background:var(--bg2); border:1.5px solid var(--border);
  border-radius:16px; padding:14px 16px; margin-bottom:10px;
  cursor:pointer; transition:border-color .18s, box-shadow .18s;
  position:relative; overflow:hidden;
}
.wo-card:active{ transform:scale(.98); }
.wo-card.selected{
  border-color:var(--a1);
  box-shadow:0 0 0 1px var(--a1), 0 4px 24px rgba(var(--a1-rgb),.18);
}
.wo-card.oggi-card{
  border-color:rgba(var(--a1-rgb),.35);
  background:linear-gradient(135deg,#060d1a,#051020);
}
.wo-card.oggi-card.selected{
  border-color:var(--a1);
  box-shadow:0 0 0 1px var(--a1), 0 4px 28px rgba(var(--a1-rgb),.25);
}

/* badge oggi */
.oggi-badge{
  position:absolute; top:12px; right:12px;
  background:rgba(var(--a1-rgb),.15); border:1px solid rgba(var(--a1-rgb),.3);
  border-radius:99px; padding:3px 10px;
  font-size:9px; font-weight:500; color:var(--a2); letter-spacing:.5px;
  font-family:var(--mono); text-transform:uppercase;
}
.selected-check{
  position:absolute; top:12px; right:12px;
  width:22px; height:22px; border-radius:50%;
  background:linear-gradient(135deg,var(--a1),var(--a2));
  display:flex; align-items:center; justify-content:center;
  font-size:11px; color:#fff;
  opacity:0; transform:scale(.6);
  transition:opacity .2s, transform .2s cubic-bezier(.34,1.56,.64,1);
}
.wo-card.selected .selected-check{ opacity:1; transform:scale(1); }
.wo-card.oggi-card .oggi-badge{ display:block; }
.wo-card.oggi-card.selected .oggi-badge{ display:none; }

.wo-top{ display:flex; align-items:center; gap:12px; margin-bottom:10px; }
.wo-icon{
  width:44px; height:44px; border-radius:12px; flex-shrink:0;
  background:var(--bg3); border:1px solid rgba(var(--a1-rgb),.15);
  display:flex; align-items:center; justify-content:center; font-size:20px;
}
.wo-name{ font-size:15px; font-weight:600; color:var(--text); }
.wo-type{ font-size:11px; color:var(--textm); margin-top:2px; }

.wo-meta{
  display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px;
}
.wo-chip{
  background:var(--bg3); border:1px solid var(--border);
  border-radius:99px; padding:4px 10px;
  font-size:10px; color:var(--textm); font-family:var(--mono);
}

/* lista esercizi (collassabile) */
.wo-exs{ display:none; flex-direction:column; gap:6px; }
.wo-card.expanded .wo-exs{ display:flex; }
.ex-row{
  display:flex; align-items:center; gap:8px;
  background:var(--bg3); border-radius:8px; padding:7px 10px;
}
.ex-row-icon{ font-size:14px; width:22px; text-align:center; flex-shrink:0; }
.ex-row-name{ font-size:12px; color:var(--text); flex:1; }
.ex-row-detail{ font-size:10px; color:var(--textm); font-family:var(--mono); }

.expand-btn{
  font-size:10px; color:var(--a2); font-family:var(--mono);
  letter-spacing:.5px; margin-top:2px; display:inline-block;
}

/* card allenamento libero */
.wo-card.libero .wo-icon{
  background:rgba(0,230,118,.08); border-color:rgba(0,230,118,.2);
}
.wo-card.libero .wo-name{ color:var(--green); }

/* footer fisso */
.footer{
  position:fixed !important; bottom:0; left:50%; transform:translateX(-50%);
  width:100%; max-width:480px;
  padding:16px 20px 32px;
  background:linear-gradient(transparent, var(--bg) 35%);
  pointer-events:none;
  z-index:15;
}
.start-btn{
  width:100%; padding:16px; border:none; border-radius:16px;
  font-size:15px; font-weight:600; color:#fff; cursor:pointer;
  font-family:var(--font); letter-spacing:.3px;
  background:linear-gradient(135deg,var(--a1),var(--a2));
  box-shadow:0 4px 24px rgba(var(--a1-rgb),.3);
  transition:opacity .2s, transform .1s;
  pointer-events:all; position:relative; overflow:hidden;
}
.start-btn:disabled{
  background:transparent; box-shadow:none; color:var(--textm);
  cursor:default; border:1.5px dashed rgba(48,72,112,.7);
}
@keyframes arrowBounce{ 0%,100%{transform:translateY(0);} 50%{transform:translateY(-3px);} }
.start-btn:disabled .arr{ display:inline-block; animation:arrowBounce 1.4s ease-in-out infinite; }
.start-btn:not(:disabled):active{ transform:scale(.98); }
.start-btn::after{
  content:''; position:absolute; top:0; left:-60%;
  width:35%; height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.2),transparent);
  transform:skewX(-15deg); animation:btnShine 3s ease infinite;
}
.start-btn:disabled::after{ display:none; }
@keyframes btnShine{ 0%,55%{left:-60%;} 80%,100%{left:130%;} }

/* effetti */
body::before{
  content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
  background:
    radial-gradient(ellipse 80% 35% at 50% -5%, rgba(var(--a1-rgb),.08), transparent),
    radial-gradient(ellipse 40% 25% at 85% 90%, rgba(0,60,180,.05), transparent);
}
.scroll-area, .hdr{ position:relative; z-index:1; }

@keyframes fadeUp{
  from{ opacity:0; transform:translateY(14px); }
  to{   opacity:1; transform:translateY(0); }
}
.wo-card{ animation:fadeUp .3s ease both; }

/* ── overlay / sheet ── */
.overlay{
  position:fixed; inset:0; z-index:60;
  background:rgba(0,0,0,.75);
  display:none; align-items:flex-end; justify-content:center;
}
.overlay.open{ display:flex; }
.sheet{
  background:var(--bg2); border-radius:20px 20px 0 0;
  border:1px solid var(--border); border-bottom:none;
  width:100%; max-width:480px; padding:24px 20px 36px;
  animation:slideUp .3s cubic-bezier(.4,0,.2,1);
  max-height:85vh; overflow-y:auto;
}
.sheet::-webkit-scrollbar{ width:0; }
@keyframes slideUp{ from{transform:translateY(100%);} to{transform:translateY(0);} }
.sheet-handle{ width:36px; height:4px; border-radius:99px; background:var(--border); margin:0 auto 20px; }
.sheet-title{ font-size:17px; font-weight:600; color:var(--text); margin-bottom:6px; }
.sheet-sub{ font-size:13px; color:var(--textm); margin-bottom:20px; line-height:1.5; }
.field-lbl{ font-size:9px; color:var(--textm); text-transform:uppercase; letter-spacing:1.5px; margin-bottom:6px; display:block; }
.field-inp{
  width:100%; background:var(--bg3); border:1px solid var(--border);
  border-radius:10px; padding:11px 14px; color:var(--text);
  font-family:var(--font); font-size:15px; outline:none;
  transition:border-color .15s; margin-bottom:14px;
}
.field-inp:focus{ border-color:var(--a1); }
.field-inp::placeholder{ color:var(--textm); }
.primary-btn{
  width:100%; padding:14px; border-radius:12px;
  background:linear-gradient(135deg,var(--a1),var(--a2));
  border:none; color:#fff; font-size:14px; font-weight:500;
  cursor:pointer; font-family:var(--font); transition:opacity .15s;
}
.primary-btn:disabled{ opacity:.4; cursor:default; }
.cancel-btn{
  width:100%; padding:12px; background:none; border:none;
  color:var(--textm); font-family:var(--font); font-size:13px;
  cursor:pointer; margin-top:8px;
}

/* ── tipo allenamento (log manuale) ── */
.tipo-row{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:14px; }
.tipo-btn{
  padding:10px 6px; border-radius:10px;
  background:var(--bg3); border:1.5px solid var(--border);
  color:var(--textm); font-family:var(--font); font-size:12px;
  font-weight:500; cursor:pointer; text-align:center; transition:all .15s;
}
.tipo-btn.sel{ border-color:var(--a1); color:var(--a2); background:rgba(var(--a1-rgb),.08); }

/* ── esercizi personalizzati ── */
.cex-row{
  display:flex; align-items:center; gap:8px;
  background:var(--bg3); border-radius:10px;
  padding:10px 12px; margin-bottom:8px;
}
.cex-name{ flex:1; font-size:13px; font-weight:500; color:var(--text); }
.cex-detail{ font-size:11px; color:var(--textm); font-family:var(--mono); flex-shrink:0; }
.cex-del{
  width:26px; height:26px; border-radius:7px; flex-shrink:0;
  background:rgba(255,68,85,.08); border:1px solid rgba(255,68,85,.2);
  color:#ff4455; font-size:14px; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
}
.add-ex-row{ display:flex; gap:8px; margin-bottom:16px; }
.add-ex-row .field-inp{ margin-bottom:0; }
.add-ex-row .field-inp.sm{ width:64px; flex-shrink:0; text-align:center; }
.add-ex-btn{
  padding:11px 14px; border-radius:10px;
  background:rgba(var(--a1-rgb),.1); border:1px solid rgba(var(--a1-rgb),.2);
  color:var(--a2); font-size:18px; cursor:pointer; flex-shrink:0;
}

/* ── card manuale ── */
.wo-card.manuale .wo-icon{
  background:rgba(255,170,0,.08); border-color:rgba(255,170,0,.2);
}
.wo-card.manuale .wo-name{ color:var(--warn, #ffaa00); }
/* ══ LIGHT THEME ══ */
html.theme-light{
  --bg:#f0f7ff; --bg2:#ffffff; --bg3:#e8f1ff;
  --a1:#0066dd; --a2:#0099ff; --t1:#0066dd; --t2:#0099ff;
  --text:#0d2137; --textm:#4a7099; --border:#c0d8f5;
  --green:#059669; --red:#dc2626; --warn:#d97706;
}
html.theme-light body{ background:var(--bg); }
html.theme-light body::before{ display:none; }
html.theme-light .tab-bar{ background:rgba(240,253,251,.97) !important; }
html.theme-light .tab-item.on{ color:var(--a1); }

/* ── PWA standalone: tab-bar sempre visibile ── */
@media all and (display-mode: standalone) {
  .tab-bar {
    position: fixed !important;
    bottom: 0 !important;
    left: 0 !important;
    right: 0 !important;
  }
  .scroll-area {
    padding-bottom: calc(120px + env(safe-area-inset-bottom, 0px)) !important;
  }
  .footer {
    padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  }
}
</style>
</head>
<body>

<div class="hdr">
  <button class="back-btn" onclick="history.back()">←</button>
  <div>
    <div class="hdr-title">Scegli allenamento</div>
    <div class="hdr-sub" id="hdrSub">Cosa vuoi fare oggi?</div>
  </div>
</div>

<div class="scroll-area" id="scrollArea"></div>

<div class="footer">
  <button class="start-btn" id="startBtn" disabled onclick="avvia()"><span class="arr">↑</span> Seleziona un allenamento</button>
</div>

<!-- SHEET: PERSONALIZZA ALLENAMENTO LIBERO -->
<div class="overlay" id="customizeSheet" onclick="closeCustomizeOnBg(event)">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title">✏️ Personalizza allenamento</div>
    <div class="sheet-sub">Aggiungi e modifica gli esercizi prima di iniziare.</div>

    <div id="customExList"></div>

    <label class="field-lbl">Aggiungi esercizio</label>
    <div class="add-ex-row">
      <input class="field-inp" id="cexName" placeholder="Nome esercizio" style="flex:1;margin-bottom:0;">
      <input class="field-inp sm" id="cexSets" type="number" min="1" max="20" placeholder="Ser." title="Serie">
      <input class="field-inp sm" id="cexReps" type="number" min="1" max="100" placeholder="Rep." title="Reps">
      <button class="add-ex-btn" onclick="addCustomEx()">+</button>
    </div>

    <button class="primary-btn" id="startCustomBtn" onclick="startCustomWorkout()">Inizia allenamento →</button>
    <button class="cancel-btn" onclick="closeCustomizeSheet()">Annulla</button>
  </div>
</div>

<!-- SHEET: LOG MANUALE ATTIVITÀ PASSATA -->
<div class="overlay" id="logManualeSheet" onclick="closeLogManualeOnBg(event)">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title">📋 Registra attività</div>
    <div class="sheet-sub">Aggiungi una sessione già completata.</div>

    <label class="field-lbl">Tipo</label>
    <div class="tipo-row">
      <button class="tipo-btn sel" data-tipo="run" onclick="selectLogTipo('run')">🏃 Corsa</button>
      <button class="tipo-btn" data-tipo="gym" onclick="selectLogTipo('gym')">🏋️ Palestra</button>
      <button class="tipo-btn" data-tipo="bike" onclick="selectLogTipo('bike')">🚴 Bici</button>
      <button class="tipo-btn" data-tipo="other" onclick="selectLogTipo('other')">💪 Altro</button>
    </div>

    <label class="field-lbl">Data</label>
    <input class="field-inp" id="logData" type="date">

    <label class="field-lbl">Durata (minuti)</label>
    <input class="field-inp" id="logDurata" type="number" min="1" max="600" placeholder="es. 45">

    <div id="logKmWrap">
      <label class="field-lbl">Km percorsi</label>
      <input class="field-inp" id="logKm" type="number" min="0" max="999" step="0.1" placeholder="es. 5.2">
    </div>

    <label class="field-lbl">Note (opzionale)</label>
    <input class="field-inp" id="logNote" placeholder="Come è andata?">

    <button class="primary-btn" onclick="saveLogManuale()">Salva sessione</button>
    <button class="cancel-btn" onclick="closeLogManualeSheet()">Annulla</button>
  </div>
</div>

<script>
// Onboarding guard — reindirizza solo se non ci sono dati (nuovo utente)
(function(){
  try {
    var _raw = localStorage.getItem('fittrack_v4');
    if (!_raw) { location.replace('onboarding.html'); return; }
    var _d = JSON.parse(_raw);
    if ((_d.sessions && _d.sessions.length) || (_d.weightLog && _d.weightLog.length)) return;
    if (!_d.onboardingDone) location.replace('onboarding.html');
  } catch(e) { location.replace('onboarding.html'); }
})();

/* ── Carica allenamenti da localStorage ── */
const _TICON2  = {gym:'🏋️', run:'🏃', bike:'🚴', other:'💪'};
const _TLABEL2 = {gym:'Palestra', run:'Corsa', bike:'Bici', other:'Altro'};

let _sd = {};
try{ _sd = JSON.parse(localStorage.getItem('fittrack_v4')) || {}; } catch(e){}

const WORKOUTS = (_sd.workouts && _sd.workouts.length)
  ? _sd.workouts.map(w => ({
      id:        w.id,
      name:      w.name,
      type:      w.type,
      typeLabel: _TLABEL2[w.type] || 'Altro',
      icon:      _TICON2[w.type]  || '💪',
      exs:       w.exs.map(ex => ({
        name: ex.name, sets: ex.sets, reps: ex.reps,
        rec:  ex.rec || 90, icon: _TICON2[w.type] || '💪', weight: ex.weight ?? null, timed: ex.timed || false
      }))
    }))
  : [];  /* nessun allenamento personalizzato ancora */

/* workout consigliato oggi dall'assignment */
const _todayIdx = (new Date().getDay()+6)%7;
const _todayWoId = (_sd.assignment || {})[_todayIdx] || null;
const todayId = _todayWoId && WORKOUTS.find(w => w.id === _todayWoId) ? _todayWoId : null;

let selectedId = null;

function minStimati(exs){
  return Math.round(exs.reduce((a,e)=>a+e.sets*(0.8+(e.rec||0)/60),0));
}

function renderCard(wo, isToday, delay){
  const min = minStimati(wo.exs);
  const exsHtml = wo.exs.map(ex=>`
    <div class="ex-row">
      <span class="ex-row-icon">${ex.icon}</span>
      <span class="ex-row-name">${ex.name}</span>
      <span class="ex-row-detail">${ex.sets}×${ex.reps}</span>
    </div>`).join('');

  return `
    <div class="wo-card${isToday?' oggi-card':''}" id="card_${wo.id}"
         style="animation-delay:${delay}s"
         onclick="selectCard('${wo.id}', event)">
      ${isToday ? '<div class="oggi-badge">● consigliato oggi</div>' : ''}
      <div class="selected-check">✓</div>
      <div class="wo-top">
        <div class="wo-icon">${wo.icon}</div>
        <div>
          <div class="wo-name">${wo.name}</div>
          <div class="wo-type">${wo.typeLabel}</div>
        </div>
      </div>
      <div class="wo-meta">
        <span class="wo-chip">🏋️ ${wo.exs.length} esercizi</span>
        <span class="wo-chip">⏱ ~${min} min</span>
        <span class="wo-chip">🔥 ~${Math.round(min*5.5)} kcal</span>
      </div>
      <span class="expand-btn" onclick="toggleExpand('${wo.id}', event)">
        Mostra esercizi ▾
      </span>
      <div class="wo-exs">${exsHtml}</div>
    </div>`;
}

function buildUI(){
  const area = document.getElementById('scrollArea');
  let html = '';

  /* sezione "oggi" se c'è un workout consigliato */
  const todayWo = WORKOUTS.find(w=>w.id===todayId);
  if(todayWo){
    document.getElementById('hdrSub').textContent =
      `Oggi: ${todayWo.name} · ${todayWo.typeLabel}`;
    html += '<div class="section-lbl">Consigliato oggi</div>';
    html += renderCard(todayWo, true, 0);
  }

  /* sezione "tutti gli allenamenti" */
  html += '<div class="section-lbl">Tutti gli allenamenti</div>';
  if(WORKOUTS.length === 0){
    html += `<div style="text-align:center;padding:20px 0;color:var(--textm);font-size:13px;line-height:1.6;">
      Nessun allenamento creato.<br>
      <span style="color:var(--a2);cursor:pointer;" onclick="location.href='impostazioni.html'">
        Creane uno nelle Impostazioni →
      </span>
    </div>`;
  } else {
    WORKOUTS.forEach((wo, i) => {
      html += renderCard(wo, false, i * 0.05);
    });
  }

  /* allenamento libero + log manuale */
  html += `<div class="section-lbl">Libero</div>
    <div class="wo-card libero" id="card_libero"
         style="animation-delay:${WORKOUTS.length*0.05}s"
         onclick="selectCard('libero', event)">
      <div class="selected-check">✓</div>
      <div class="wo-top">
        <div class="wo-icon">✏️</div>
        <div>
          <div class="wo-name">Allenamento libero</div>
          <div class="wo-type">Scegli gli esercizi prima di iniziare</div>
        </div>
      </div>
      <div class="wo-meta">
        <span class="wo-chip">Personalizzabile</span>
      </div>
    </div>
    <div class="wo-card manuale" id="card_manuale"
         style="animation-delay:${(WORKOUTS.length+1)*0.05}s"
         onclick="openLogManuale()">
      <div class="wo-top">
        <div class="wo-icon">📋</div>
        <div>
          <div class="wo-name">Registra attività passata</div>
          <div class="wo-type">Aggiungi una sessione già completata</div>
        </div>
      </div>
    </div>`;

  area.innerHTML = html;

  /* seleziona automaticamente l'allenamento di oggi */
  if(todayId) selectCard(todayId);
}

function selectCard(id, e){
  if(e) e.stopPropagation();

  /* deseleziona il precedente */
  if(selectedId){
    const prev = document.getElementById('card_'+selectedId);
    if(prev) prev.classList.remove('selected');
  }

  selectedId = id;
  const card = document.getElementById('card_'+id);
  if(card) card.classList.add('selected');

  const btn = document.getElementById('startBtn');
  const wo = WORKOUTS.find(w=>w.id===id);
  const nome = wo ? wo.name : 'Allenamento libero';
  btn.disabled = false;
  btn.textContent = `Inizia "${nome}" →`;
}

function toggleExpand(id, e){
  e.stopPropagation();
  const card = document.getElementById('card_'+id);
  const isExp = card.classList.contains('expanded');
  card.classList.toggle('expanded', !isExp);
  const btn = card.querySelector('.expand-btn');
  btn.textContent = isExp ? 'Mostra esercizi ▾' : 'Nascondi esercizi ▴';
}

function avvia(){
  if(!selectedId) return;

  if(selectedId === 'libero'){
    openCustomizeSheet();
    return;
  }

  const wo = WORKOUTS.find(w=>w.id===selectedId);
  if(!wo) return;
  const today = new Date();
  const giorni = ['Domenica','Lunedì','Martedì','Mercoledì','Giovedì','Venerdì','Sabato'];
  const pending = {
    name:      wo.name,
    day:       `${giorni[today.getDay()]} · ${wo.typeLabel}`,
    type:      wo.type,
    typeLabel: wo.typeLabel,
    typeIcon:  wo.icon,
    exs:       wo.exs.map(ex=>({name:ex.name, sets:ex.sets, reps:ex.reps, rec:ex.rec||90, icon:ex.icon||'💪', circuitGroup:ex.circuitGroup??null, weight:ex.weight??null, timed:ex.timed||false}))
  };
  localStorage.setItem('fittrack_pending', JSON.stringify(pending));
  location.href = 'sessione.html';
}

/* ══════════════════════════════════════════════
   ALLENAMENTO LIBERO PERSONALIZZABILE
══════════════════════════════════════════════ */
let _customExs = [
  {name:'Squat',       sets:4, reps:10},
  {name:'Panca Piana', sets:4, reps:10},
  {name:'Trazioni',    sets:3, reps:8}
];

function openCustomizeSheet(){
  renderCustomExList();
  document.getElementById('cexName').value = '';
  document.getElementById('cexSets').value = '';
  document.getElementById('cexReps').value = '';
  document.getElementById('customizeSheet').classList.add('open');
}
function closeCustomizeSheet(){ document.getElementById('customizeSheet').classList.remove('open'); }
function closeCustomizeOnBg(e){ if(e.target === document.getElementById('customizeSheet')) closeCustomizeSheet(); }

function renderCustomExList(){
  const list = document.getElementById('customExList');
  if(!_customExs.length){
    list.innerHTML = `<div style="text-align:center;color:var(--textm);font-size:12px;padding:12px 0 16px;">Nessun esercizio. Aggiungine uno sotto.</div>`;
    return;
  }
  list.innerHTML = _customExs.map((ex, i) => `
    <div class="cex-row">
      <div class="cex-name">${ex.name}</div>
      <div class="cex-detail">${ex.sets}×${ex.reps}</div>
      <button class="cex-del" onclick="removeCustomEx(${i})">✕</button>
    </div>
  `).join('');
}

function addCustomEx(){
  const name = document.getElementById('cexName').value.trim();
  const sets = parseInt(document.getElementById('cexSets').value) || 3;
  const reps = parseInt(document.getElementById('cexReps').value) || 10;
  if(!name){ document.getElementById('cexName').focus(); return; }
  _customExs.push({name, sets, reps});
  document.getElementById('cexName').value = '';
  document.getElementById('cexSets').value = '';
  document.getElementById('cexReps').value = '';
  document.getElementById('cexName').focus();
  renderCustomExList();
}

function removeCustomEx(i){
  _customExs.splice(i, 1);
  renderCustomExList();
}

function startCustomWorkout(){
  if(!_customExs.length){ alert('Aggiungi almeno un esercizio.'); return; }
  const pending = {
    name: 'Allenamento libero', day: 'Oggi · Palestra',
    type: 'gym', typeLabel: 'Palestra', typeIcon: '🏋️',
    exs: _customExs.map(ex => ({name:ex.name, sets:ex.sets, reps:ex.reps, rec:90, icon:'💪'}))
  };
  localStorage.setItem('fittrack_pending', JSON.stringify(pending));
  location.href = 'sessione.html';
}

/* ══════════════════════════════════════════════
   LOG MANUALE ATTIVITÀ PASSATA
══════════════════════════════════════════════ */
let _logTipo = 'run';

function openLogManuale(){
  _logTipo = 'run';
  document.querySelectorAll('.tipo-btn').forEach(b => b.classList.toggle('sel', b.dataset.tipo === 'run'));
  document.getElementById('logData').value = new Date().toISOString().slice(0,10);
  document.getElementById('logDurata').value = '';
  document.getElementById('logKm').value = '';
  document.getElementById('logNote').value = '';
  document.getElementById('logKmWrap').style.display = '';
  document.getElementById('logManualeSheet').classList.add('open');
}
function closeLogManualeSheet(){ document.getElementById('logManualeSheet').classList.remove('open'); }
function closeLogManualeOnBg(e){ if(e.target === document.getElementById('logManualeSheet')) closeLogManualeSheet(); }

function selectLogTipo(t){
  _logTipo = t;
  document.querySelectorAll('.tipo-btn').forEach(b => b.classList.toggle('sel', b.dataset.tipo === t));
  document.getElementById('logKmWrap').style.display = (t==='run'||t==='bike') ? '' : 'none';
}

function saveLogManuale(){
  const dateVal    = document.getElementById('logData').value;
  const durMin     = parseInt(document.getElementById('logDurata').value);
  const km         = parseFloat(document.getElementById('logKm').value) || 0;
  const note       = document.getElementById('logNote').value.trim();

  if(!dateVal){ alert('Inserisci una data.'); return; }
  if(!durMin || durMin < 1){ alert('Inserisci una durata valida.'); return; }

  const TICON  = {gym:'🏋️', run:'🏃', bike:'🚴', other:'💪'};
  const TLABEL = {gym:'Palestra', run:'Corsa', bike:'Bici', other:'Altro'};
  const MET    = {gym:5.0, run:9.0, bike:7.0, other:5.0};

  const sessSec = durMin * 60;
  let kcal = Math.round(MET[_logTipo] * 70 * (sessSec/3600));
  try{
    const _d = JSON.parse(localStorage.getItem('fittrack_v4')) || {};
    const kg = _d.currentWeight || _d.profile?.currentWeight || 70;
    kcal = Math.round(MET[_logTipo] * kg * (sessSec/3600));
  } catch(e){}

  const dateObj  = new Date(dateVal + 'T12:00:00');
  const dayIndex = (dateObj.getDay()+6)%7;
  const dayLabels= ['Lunedì','Martedì','Mercoledì','Giovedì','Venerdì','Sabato','Domenica'];

  const session = {
    date:      dateVal,
    dayIndex,
    dayLabel:  dayLabels[dayIndex],
    type:      _logTipo,
    typeLabel: TLABEL[_logTipo],
    typeIcon:  TICON[_logTipo],
    kcal,
    duration:  sessSec,
    km:        (_logTipo==='run'||_logTipo==='bike') ? km : 0,
    sessionNote: note,
    sets:      [],
    manuale:   true
  };

  try{
    const data = JSON.parse(localStorage.getItem('fittrack_v4')) || {};
    if(!data.sessions) data.sessions = [];
    /* inserisci in ordine cronologico */
    const idx = data.sessions.findIndex(s => s.date <= dateVal);
    if(idx === -1) data.sessions.push(session);
    else data.sessions.splice(idx, 0, session);
    localStorage.setItem('fittrack_v4', JSON.stringify(data));
    closeLogManualeSheet();
    /* feedback visivo poi torna */
    const btn = document.querySelector('#logManualeSheet .primary-btn');
    if(btn){ btn.textContent = '✓ Salvato!'; setTimeout(() => location.href='registra.html', 800); }
    else location.href = 'registra.html';
  } catch(e){ alert('Errore nel salvataggio: ' + e.message); }
}

buildUI();
</script>
