<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>FitTrack · Scegli allenamento</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>
(function(){
  try{
    var d=JSON.parse(localStorage.getItem('fittrack_v4'));
    var th={blue:['#0088ff','#00ccff'],purple:['#7c3aed','#a855f7'],orange:['#f97316','#fbbf24']};
    var t=th[(d&&d.theme)||'blue']||th.blue;
    document.documentElement.style.setProperty('--a1',t[0]);
    document.documentElement.style.setProperty('--a2',t[1]);
  }catch(e){}
})();
</script>
<style>
:root{
  --bg:#020810; --bg2:#060d1a; --bg3:#0a1428;
  --a1:#0088ff; --a2:#00ccff;
  --text:#e0f4ff; --textm:#304870; --border:#0d1e38;
  --green:#00e676; --font:'DM Sans',sans-serif; --mono:'DM Mono',monospace;
}
*{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html{ height:-webkit-fill-available; }
body{
  background:var(--bg); color:var(--text); font-family:var(--font);
  max-width:480px; margin:0 auto;
  min-height:100vh; min-height:100dvh; min-height:-webkit-fill-available;
  display:flex; flex-direction:column;
}

/* header */
.hdr{
  display:flex; align-items:center; gap:12px;
  padding:16px 20px 14px; border-bottom:1px solid var(--border);
  flex-shrink:0;
}
.back-btn{
  width:36px; height:36px; border-radius:50%; background:var(--bg3);
  border:1px solid var(--border); color:var(--textm); font-size:16px;
  display:flex; align-items:center; justify-content:center; cursor:pointer;
  flex-shrink:0;
}
.hdr-title{ font-size:16px; font-weight:600; color:var(--text); }
.hdr-sub{ font-size:11px; color:var(--textm); margin-top:1px; }

/* scroll */
.scroll-area{ flex:1; overflow-y:auto; padding:20px 16px calc(120px + env(safe-area-inset-bottom, 0px)); -webkit-overflow-scrolling:touch; }
.scroll-area::-webkit-scrollbar{ width:0; }

/* sezione */
.section-lbl{
  font-family:var(--mono); font-size:9px; color:var(--textm);
  letter-spacing:2px; text-transform:uppercase;
  display:flex; align-items:center; gap:8px;
  margin-bottom:10px; margin-top:24px;
}
.section-lbl:first-child{ margin-top:0; }
.section-lbl::after{
  content:''; flex:1; height:1px; background:var(--border);
}

/* card allenamento */
.wo-card{
  background:var(--bg2); border:1.5px solid var(--border);
  border-radius:16px; padding:14px 16px; margin-bottom:10px;
  cursor:pointer; transition:border-color .18s, box-shadow .18s;
  position:relative; overflow:hidden;
}
.wo-card:active{ transform:scale(.98); }
.wo-card.selected{
  border-color:var(--a1);
  box-shadow:0 0 0 1px var(--a1), 0 4px 24px rgba(0,136,255,.18);
}
.wo-card.oggi-card{
  border-color:rgba(0,136,255,.35);
  background:linear-gradient(135deg,#060d1a,#051020);
}
.wo-card.oggi-card.selected{
  border-color:var(--a1);
  box-shadow:0 0 0 1px var(--a1), 0 4px 28px rgba(0,136,255,.25);
}

/* badge oggi */
.oggi-badge{
  position:absolute; top:12px; right:12px;
  background:rgba(0,136,255,.15); border:1px solid rgba(0,136,255,.3);
  border-radius:99px; padding:3px 10px;
  font-size:9px; font-weight:500; color:var(--a2); letter-spacing:.5px;
  font-family:var(--mono); text-transform:uppercase;
}
.selected-check{
  position:absolute; top:12px; right:12px;
  width:22px; height:22px; border-radius:50%;
  background:linear-gradient(135deg,var(--a1),var(--a2));
  display:flex; align-items:center; justify-content:center;
  font-size:11px; color:#fff;
  opacity:0; transform:scale(.6);
  transition:opacity .2s, transform .2s cubic-bezier(.34,1.56,.64,1);
}
.wo-card.selected .selected-check{ opacity:1; transform:scale(1); }
.wo-card.oggi-card .oggi-badge{ display:block; }
.wo-card.oggi-card.selected .oggi-badge{ display:none; }

.wo-top{ display:flex; align-items:center; gap:12px; margin-bottom:10px; }
.wo-icon{
  width:44px; height:44px; border-radius:12px; flex-shrink:0;
  background:var(--bg3); border:1px solid rgba(0,136,255,.15);
  display:flex; align-items:center; justify-content:center; font-size:20px;
}
.wo-name{ font-size:15px; font-weight:600; color:var(--text); }
.wo-type{ font-size:11px; color:var(--textm); margin-top:2px; }

.wo-meta{
  display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px;
}
.wo-chip{
  background:var(--bg3); border:1px solid var(--border);
  border-radius:99px; padding:4px 10px;
  font-size:10px; color:var(--textm); font-family:var(--mono);
}

/* lista esercizi (collassabile) */
.wo-exs{ display:none; flex-direction:column; gap:6px; }
.wo-card.expanded .wo-exs{ display:flex; }
.ex-row{
  display:flex; align-items:center; gap:8px;
  background:var(--bg3); border-radius:8px; padding:7px 10px;
}
.ex-row-icon{ font-size:14px; width:22px; text-align:center; flex-shrink:0; }
.ex-row-name{ font-size:12px; color:var(--text); flex:1; }
.ex-row-detail{ font-size:10px; color:var(--textm); font-family:var(--mono); }

.expand-btn{
  font-size:10px; color:var(--a2); font-family:var(--mono);
  letter-spacing:.5px; margin-top:2px; display:inline-block;
}

/* card allenamento libero */
.wo-card.libero .wo-icon{
  background:rgba(0,230,118,.08); border-color:rgba(0,230,118,.2);
}
.wo-card.libero .wo-name{ color:var(--green); }

/* footer fisso */
.footer{
  position:fixed; bottom:0; left:50%; transform:translateX(-50%);
  width:100%; max-width:480px;
  padding:16px 20px 32px;
  background:linear-gradient(transparent, var(--bg) 35%);
  pointer-events:none;
}
.start-btn{
  width:100%; padding:16px; border:none; border-radius:16px;
  font-size:15px; font-weight:600; color:#fff; cursor:pointer;
  font-family:var(--font); letter-spacing:.3px;
  background:linear-gradient(135deg,var(--a1),var(--a2));
  box-shadow:0 4px 24px rgba(0,136,255,.3);
  transition:opacity .2s, transform .1s;
  pointer-events:all; position:relative; overflow:hidden;
}
.start-btn:disabled{
  background:var(--bg3); box-shadow:none; color:var(--textm); cursor:default;
}
.start-btn:not(:disabled):active{ transform:scale(.98); }
.start-btn::after{
  content:''; position:absolute; top:0; left:-60%;
  width:35%; height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.2),transparent);
  transform:skewX(-15deg); animation:btnShine 3s ease infinite;
}
.start-btn:disabled::after{ display:none; }
@keyframes btnShine{ 0%,55%{left:-60%;} 80%,100%{left:130%;} }

/* effetti */
body::before{
  content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
  background:
    radial-gradient(ellipse 80% 35% at 50% -5%, rgba(0,136,255,.08), transparent),
    radial-gradient(ellipse 40% 25% at 85% 90%, rgba(0,60,180,.05), transparent);
}
.scroll-area, .footer, .hdr{ position:relative; z-index:1; }

@keyframes fadeUp{
  from{ opacity:0; transform:translateY(14px); }
  to{   opacity:1; transform:translateY(0); }
}
.wo-card{ animation:fadeUp .3s ease both; }
</style>
</head>
<body>

<div class="hdr">
  <button class="back-btn" onclick="history.back()">←</button>
  <div>
    <div class="hdr-title">Scegli allenamento</div>
    <div class="hdr-sub" id="hdrSub">Cosa vuoi fare oggi?</div>
  </div>
</div>

<div class="scroll-area" id="scrollArea"></div>

<div class="footer">
  <button class="start-btn" id="startBtn" disabled onclick="avvia()">Seleziona un allenamento</button>
</div>

<script>
// Onboarding guard — reindirizza solo se non ci sono dati (nuovo utente)
(function(){
  try {
    var _raw = localStorage.getItem('fittrack_v4');
    if (!_raw) { location.replace('onboarding.html'); return; }
    var _d = JSON.parse(_raw);
    if ((_d.sessions && _d.sessions.length) || (_d.weightLog && _d.weightLog.length)) return;
    if (!_d.onboardingDone) location.replace('onboarding.html');
  } catch(e) { location.replace('onboarding.html'); }
})();

/* ── Carica allenamenti da localStorage ── */
const _TICON2  = {gym:'🏋️', run:'🏃', bike:'🚴', other:'💪'};
const _TLABEL2 = {gym:'Palestra', run:'Corsa', bike:'Bici', other:'Altro'};

let _sd = {};
try{ _sd = JSON.parse(localStorage.getItem('fittrack_v4')) || {}; } catch(e){}

const WORKOUTS = (_sd.workouts && _sd.workouts.length)
  ? _sd.workouts.map(w => ({
      id:        w.id,
      name:      w.name,
      type:      w.type,
      typeLabel: _TLABEL2[w.type] || 'Altro',
      icon:      _TICON2[w.type]  || '💪',
      exs:       w.exs.map(ex => ({
        name: ex.name, sets: ex.sets, reps: ex.reps,
        rec:  ex.rec || 90, icon: _TICON2[w.type] || '💪'
      }))
    }))
  : [];  /* nessun allenamento personalizzato ancora */

/* workout consigliato oggi dall'assignment */
const _todayIdx = (new Date().getDay()+6)%7;
const _todayWoId = (_sd.assignment || {})[_todayIdx] || null;
const todayId = _todayWoId && WORKOUTS.find(w => w.id === _todayWoId) ? _todayWoId : null;

let selectedId = null;

function minStimati(exs){
  return Math.round(exs.reduce((a,e)=>a+e.sets*(0.8+(e.rec||0)/60),0));
}

function renderCard(wo, isToday, delay){
  const min = minStimati(wo.exs);
  const exsHtml = wo.exs.map(ex=>`
    <div class="ex-row">
      <span class="ex-row-icon">${ex.icon}</span>
      <span class="ex-row-name">${ex.name}</span>
      <span class="ex-row-detail">${ex.sets}×${ex.reps}</span>
    </div>`).join('');

  return `
    <div class="wo-card${isToday?' oggi-card':''}" id="card_${wo.id}"
         style="animation-delay:${delay}s"
         onclick="selectCard('${wo.id}', event)">
      ${isToday ? '<div class="oggi-badge">● consigliato oggi</div>' : ''}
      <div class="selected-check">✓</div>
      <div class="wo-top">
        <div class="wo-icon">${wo.icon}</div>
        <div>
          <div class="wo-name">${wo.name}</div>
          <div class="wo-type">${wo.typeLabel}</div>
        </div>
      </div>
      <div class="wo-meta">
        <span class="wo-chip">🏋️ ${wo.exs.length} esercizi</span>
        <span class="wo-chip">⏱ ~${min} min</span>
        <span class="wo-chip">🔥 ~${Math.round(min*5.5)} kcal</span>
      </div>
      <span class="expand-btn" onclick="toggleExpand('${wo.id}', event)">
        Mostra esercizi ▾
      </span>
      <div class="wo-exs">${exsHtml}</div>
    </div>`;
}

function buildUI(){
  const area = document.getElementById('scrollArea');
  let html = '';

  /* sezione "oggi" se c'è un workout consigliato */
  const todayWo = WORKOUTS.find(w=>w.id===todayId);
  if(todayWo){
    document.getElementById('hdrSub').textContent =
      `Oggi: ${todayWo.name} · ${todayWo.typeLabel}`;
    html += '<div class="section-lbl">Consigliato oggi</div>';
    html += renderCard(todayWo, true, 0);
  }

  /* sezione "tutti gli allenamenti" */
  html += '<div class="section-lbl">Tutti gli allenamenti</div>';
  if(WORKOUTS.length === 0){
    html += `<div style="text-align:center;padding:20px 0;color:var(--textm);font-size:13px;line-height:1.6;">
      Nessun allenamento creato.<br>
      <span style="color:var(--a2);cursor:pointer;" onclick="location.href='impostazioni.html'">
        Creane uno nelle Impostazioni →
      </span>
    </div>`;
  } else {
    WORKOUTS.forEach((wo, i) => {
      html += renderCard(wo, false, i * 0.05);
    });
  }

  /* allenamento libero */
  html += `<div class="section-lbl">Libero</div>
    <div class="wo-card libero" id="card_libero"
         style="animation-delay:${WORKOUTS.length*0.05}s"
         onclick="selectCard('libero', event)">
      <div class="selected-check">✓</div>
      <div class="wo-top">
        <div class="wo-icon">✏️</div>
        <div>
          <div class="wo-name">Allenamento libero</div>
          <div class="wo-type">Scegli esercizi sul momento</div>
        </div>
      </div>
      <div class="wo-meta">
        <span class="wo-chip">Personalizzato</span>
      </div>
    </div>`;

  area.innerHTML = html;

  /* seleziona automaticamente l'allenamento di oggi */
  if(todayId) selectCard(todayId);
}

function selectCard(id, e){
  if(e) e.stopPropagation();

  /* deseleziona il precedente */
  if(selectedId){
    const prev = document.getElementById('card_'+selectedId);
    if(prev) prev.classList.remove('selected');
  }

  selectedId = id;
  const card = document.getElementById('card_'+id);
  if(card) card.classList.add('selected');

  const btn = document.getElementById('startBtn');
  const wo = WORKOUTS.find(w=>w.id===id);
  const nome = wo ? wo.name : 'Allenamento libero';
  btn.disabled = false;
  btn.textContent = `Inizia "${nome}" →`;
}

function toggleExpand(id, e){
  e.stopPropagation();
  const card = document.getElementById('card_'+id);
  const isExp = card.classList.contains('expanded');
  card.classList.toggle('expanded', !isExp);
  const btn = card.querySelector('.expand-btn');
  btn.textContent = isExp ? 'Mostra esercizi ▾' : 'Nascondi esercizi ▴';
}

function avvia(){
  if(!selectedId) return;

  let pending;
  if(selectedId === 'libero'){
    pending = {
      name:'Allenamento libero', day:'Oggi',
      type:'gym', typeLabel:'Palestra', typeIcon:'🏋️',
      exs:[
        {name:'Squat',       sets:4, reps:10, rec:120, icon:'🏋️'},
        {name:'Panca Piana', sets:4, reps:10, rec:90,  icon:'🏋️'},
        {name:'Trazioni',    sets:3, reps:8,  rec:90,  icon:'💪'},
      ]
    };
  } else {
    const wo = WORKOUTS.find(w=>w.id===selectedId);
    if(!wo) return;
    const today = new Date();
    const giorni = ['Domenica','Lunedì','Martedì','Mercoledì','Giovedì','Venerdì','Sabato'];
    pending = {
      name:      wo.name,
      day:       `${giorni[today.getDay()]} · ${wo.typeLabel}`,
      type:      wo.type,
      typeLabel: wo.typeLabel,
      typeIcon:  wo.icon,
      exs:       wo.exs.map(ex=>({name:ex.name, sets:ex.sets, reps:ex.reps, rec:ex.rec||90, icon:ex.icon||'💪'}))
    };
  }

  localStorage.setItem('fittrack_pending', JSON.stringify(pending));
  location.href = 'sessione.html';
}

buildUI();
</script>
</body>
</html>
